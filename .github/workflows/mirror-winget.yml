name: Mirror winget-pkgs to R2

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sparse clone winget-pkgs manifests
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/microsoft/winget-pkgs.git winget-src
          git -C winget-src sparse-checkout set manifests

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y python3-yaml jq
          pip install pyyaml tomli_w awscli --break-system-packages --quiet

      - name: Build compact index dari manifests
        run: python3 build-winget-index.py winget-src/manifests winget-index/

      - name: Upload index ke R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync winget-index/ "s3://${{ secrets.R2_BUCKET }}/winget-mirror/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" --delete
